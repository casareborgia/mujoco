[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-ball-maze"
version = "0.1.0"
description = "Gymnasium MuJoCo Two-Stage Branching Maze RL Environment (TwoStageBallMaze-v0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "mujoco>=3.0.0",
    "numpy>=1.25.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
]

[tool.setuptools]
py-modules = ["run", "generate_report_assets"]

[project.entry-points."gymnasium.envs"]
__root__ = "run:register_gymnasium_envs"
